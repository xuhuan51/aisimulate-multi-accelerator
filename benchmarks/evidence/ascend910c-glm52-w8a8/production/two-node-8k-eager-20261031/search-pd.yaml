traffic:
  source: {type: synthetic, input_tokens: 8192, output_tokens: 1024}
  load: {type: concurrency, concurrency: 8}
  stop: {requests: 16}
engine:
  model: /data_lib/data/models/glm-q
  hardware: ascend910c
  backend: sglang
  backend_version: "0.5.22"
  mode: disaggregated
  context_length: 180000
  pd_routing: replica_round_robin
  gemm_quant_mode: w8a8
  moe_quant_mode: w8a8_dynamic
  fmha_quant_mode: bfloat16
  kvcache_quant_mode: bfloat16
  comm_quant_mode: half
  estimation_mode: op_level
  fallback_policy: deny
  estimator_config:
    op_level:
      ascend:
        routing: balanced
        shared_expert_overlap: true
        kv_transfer_page_layout: contiguous
        shape_policy: anchored
        decode_execution_mode: eager
  kv_transfer: {type: measured, timing_mode: full_prompt}
  workers:
    prefill:
      parallelism: {preset: default}
      scheduler: {max_batched_tokens: 8192, max_sequences: 32, chunked_prefill_size: 16384, max_prefill_tokens: 32768, ignore_eos: true}
      kv_cache:
        block_size: 128
        prefix_caching: false
        capacity: {type: default, memory_fraction: 0.88}
    decode:
      parallelism: {preset: default}
      scheduler: {max_batched_tokens: 8192, max_sequences: 32, decode_reserved_tokens: 512, ignore_eos: true}
      kv_cache:
        block_size: 128
        prefix_caching: false
        capacity: {type: default, memory_fraction: 0.90}
optimization:
  target: throughput
  constraints: {min_candidate_gpus: 32, max_candidate_gpus: 32}
optimizer: {algorithm: random, max_trials: 2000, parallelism: 1, candidate_timeout_seconds: 120.0, seed: 910}
