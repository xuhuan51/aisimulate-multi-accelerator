engine:
  backend: sglang
  backend_version: 0.5.22
  comm_quant_mode: half
  context_length: 180000
  database_mode: SILICON
  decoder_replay: false
  enable_eplb: false
  estimation_mode: op_level
  estimator_config:
    op_level:
      ascend:
        decode_execution_mode: eager
        kv_transfer_page_layout: contiguous
        routing: balanced
        shape_policy: anchored
        shared_expert_overlap: true
  fallback_policy: deny
  fmha_quant_mode: bfloat16
  gemm_quant_mode: w8a8
  hardware: ascend910c
  kv_transfer:
    bytes_per_token: auto
    timing_mode: full_prompt
    type: measured
  kvcache_quant_mode: bfloat16
  mode: disaggregated
  model: /data_lib/data/models/glm-q
  moe_quant_mode: w8a8_dynamic
  nextn: 0
  pd_routing: replica_round_robin
  workers:
    decode:
      kv_cache:
        block_size: 128
        bytes_per_token: auto
        capacity:
          cuda_graph_reserved_bytes: 0
          memory_fraction: 0.9
          type: default
        prefix_caching: false
      parallelism:
        attention_data: 1
        moe_expert: 1
        moe_tensor: 16
        pipeline: 1
        replicas: 1
        tensor: 16
      scheduler:
        decode_reserved_tokens: 512
        ignore_eos: true
        max_batched_tokens: 8192
        max_sequences: 32
        prefill_decode_interval: 0
        prefill_schedule_interval: 1
      startup_seconds: 0.0
      timing:
        comm_quant_mode: half
        database_mode: SILICON
        estimation_mode: op_level
        estimator_config:
          correction:
            enabled: true
            factor_bounds:
              max: 2.0
              min: 0.5
            feature_space: legacy_workload
            max_batch_size: 512
            max_kv_tokens: 2000000
            max_num_tokens: 8192
            min_observations: 5
            sampling:
              bins_per_axis:
              - 4
              - 4
              max_observations: 64
          features:
            attention_kv_weight: 1.0
            ffn_token_weight: 1.0
            prefill_attention_pair_weight: 1.0
          fpm_interpolation:
            method: sol
          fpm_regression:
            fit:
              kind: standardized_nnls
              rebuild_interval: null
              singular_ridge_scale: 1.0e-09
            min_observations: 5
            sampling:
              bins_per_axis:
              - 4
              - 4
              max_observations: 64
          op_level:
            ascend:
              decode_execution_mode: eager
              kv_transfer_page_layout: contiguous
              routing: balanced
              shape_policy: anchored
              shared_expert_overlap: true
        fallback_policy: deny
        fmha_quant_mode: bfloat16
        gemm_quant_mode: w8a8
        kvcache_quant_mode: bfloat16
        moe_quant_mode: w8a8_dynamic
        transfer_policy:
        - xshape
        - xquant
        - xprofile
        - xop
        type: default
    prefill:
      kv_cache:
        block_size: 128
        bytes_per_token: auto
        capacity:
          cuda_graph_reserved_bytes: 0
          memory_fraction: 0.88
          type: default
        prefix_caching: false
      parallelism:
        attention_data: 2
        moe_expert: 16
        moe_tensor: 1
        pipeline: 1
        replicas: 1
        tensor: 8
      scheduler:
        chunked_prefill_size: 16384
        decode_reserved_tokens: 0
        ignore_eos: true
        max_batched_tokens: 8192
        max_prefill_tokens: 32768
        max_sequences: 32
        prefill_decode_interval: 0
        prefill_schedule_interval: 1
      startup_seconds: 0.0
      timing:
        comm_quant_mode: half
        database_mode: SILICON
        estimation_mode: op_level
        estimator_config:
          correction:
            enabled: true
            factor_bounds:
              max: 2.0
              min: 0.5
            feature_space: legacy_workload
            max_batch_size: 512
            max_kv_tokens: 2000000
            max_num_tokens: 8192
            min_observations: 5
            sampling:
              bins_per_axis:
              - 4
              - 4
              max_observations: 64
          features:
            attention_kv_weight: 1.0
            ffn_token_weight: 1.0
            prefill_attention_pair_weight: 1.0
          fpm_interpolation:
            method: sol
          fpm_regression:
            fit:
              kind: standardized_nnls
              rebuild_interval: null
              singular_ridge_scale: 1.0e-09
            min_observations: 5
            sampling:
              bins_per_axis:
              - 4
              - 4
              max_observations: 64
          op_level:
            ascend:
              decode_execution_mode: eager
              kv_transfer_page_layout: contiguous
              routing: balanced
              shape_policy: anchored
              shared_expert_overlap: true
        fallback_policy: deny
        fmha_quant_mode: bfloat16
        gemm_quant_mode: w8a8
        kvcache_quant_mode: bfloat16
        moe_quant_mode: w8a8_dynamic
        transfer_policy:
        - xshape
        - xquant
        - xprofile
        - xop
        type: default
evaluation: {}
execution:
  resources:
    available_memory_fraction: 0.9
    cpu_limit: auto
    initialization_timeout_seconds: 60.0
    memory_limit_gb: auto
    reserve_memory_fraction: 0.0
    reserve_memory_gb: 1.0
    shutdown_timeout_seconds: 5.0
traffic:
  load:
    agentic_warmup: false
    concurrency: 2
    type: concurrency
  source:
    cached_prefix_tokens: 0
    input_tokens: 8192
    output_tokens: 1024
    type: synthetic
  stop:
    requests: 4
