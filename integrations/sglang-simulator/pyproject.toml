# Modified for AISimulate multi-accelerator workload replay.
[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-simulator"
dynamic = ["version"]
description = "A simulation benchmark tool for sglang"
dependencies = [
    "numpy",
    "scikit-learn",
    "joblib",
]

[project.scripts]
sglang-simulator-collect = "sglang_simulator.tools.collect_baseline.collect:main"
sglang-simulator-train = "sglang_simulator.tools.train_ml_time_predictor.train:main"
sglang-simulator-timing = "sglang_simulator.tools.request_timing.__main__:main"

[project.optional-dependencies]
aic = [
    "aiconfigurator==0.10.0",
    # pyarrow 26 needs NumPy 2 at import, but aiconfigurator pins numpy 1.26.4;
    # drop the cap once aiconfigurator allows NumPy 2.
    "pyarrow<26",
]

[project.entry-points."aisimulate.runner_factories"]
sglang-simulator = "sglang_simulator.aisimulate_runner:NativeSGLangRunnerFactory"
