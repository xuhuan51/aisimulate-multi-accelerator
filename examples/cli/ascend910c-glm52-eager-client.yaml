engine:
  backend: sglang
  backend_version: "0.5.22"
  model: /data_lib/data/models/glm-q
  hardware: ascend910c
  mode: aggregated
  context_length: 180000
  decoder_replay: false
  nextn: 0
  gemm_quant_mode: w8a8
  moe_quant_mode: w8a8_dynamic
  kvcache_quant_mode: bfloat16
  fmha_quant_mode: bfloat16
  comm_quant_mode: half
  estimation_mode: op_level
  fallback_policy: deny
  estimator_config:
    correction: {enabled: false}
    op_level:
      ascend:
        decode_execution_mode: eager
        decode_timing_scope: runtime_layers
        enable_dp_lm_head: false
        shape_policy: anchored
        shared_expert_overlap: true
  workers:
    aggregated:
      parallelism: {tensor: 4, attention_data: 4, moe_tensor: 1, moe_expert: 16, pipeline: 1, replicas: 1}
      kv_cache:
        block_size: 128
        prefix_caching: false
        capacity: {type: fixed, blocks: 254, cuda_graph_reserved_bytes: 0}
      scheduler:
        chunked_prefill_size: 16384
        max_prefill_tokens: 32768
        max_batched_tokens: 8192
        max_sequences: 32
        decode_reserved_tokens: 0
        ignore_eos: true
traffic:
  source: {type: synthetic, input_tokens: 8192, output_tokens: 1024}
  load:
    type: concurrency
    concurrency: 4
    client_dispatch: {base_ms: 0.23129168159203983, per_input_token_us: 0.11690763496396692}
  stop: {requests: 8}
