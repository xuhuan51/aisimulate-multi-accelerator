traffic:
  source: {type: synthetic, input_tokens: 8192, output_tokens: 1024}
  load: {type: concurrency, concurrency: {choices: [8, 16, 32]}}
  stop: {requests: 64}
engine:
  model: /mnt/raid/user/data/models/glm-q
  hardware: ascend910c
  backend: sglang
  backend_version: "0.5.22"
  mode: disaggregated
  context_length: 9216
  gemm_quant_mode: w8a8
  moe_quant_mode: w8a8_dynamic
  fmha_quant_mode: bfloat16
  kvcache_quant_mode: bfloat16
  comm_quant_mode: half
  estimation_mode: op_level
  fallback_policy: deny
  estimator_config:
    op_level:
      ascend: {routing: balanced, shared_expert_overlap: true, kv_transfer_page_layout: contiguous}
  kv_transfer: {type: measured, timing_mode: full_prompt}
  workers:
    prefill:
      parallelism:
        preset:
          - {tensor: 4, attention_data: 4, moe_tensor: 1, moe_expert: 16, pipeline: 1, replicas: 1}
          - {tensor: 8, attention_data: 2, moe_tensor: 1, moe_expert: 16, pipeline: 1, replicas: 1}
          - {tensor: 4, attention_data: 4, moe_tensor: 1, moe_expert: 16, pipeline: 1, replicas: 2}
          - {tensor: 8, attention_data: 2, moe_tensor: 1, moe_expert: 16, pipeline: 1, replicas: 2}
      scheduler: {max_batched_tokens: 4096, max_sequences: 32, chunked_prefill_size: 16384, max_prefill_tokens: 32768}
      kv_cache:
        block_size: 128
        prefix_caching: false
        capacity: {type: default, memory_fraction: 0.88}
    decode:
      parallelism:
        preset:
          - {tensor: 4, attention_data: 4, moe_tensor: 1, moe_expert: 16, pipeline: 1, replicas: 1}
          - {tensor: 8, attention_data: 2, moe_tensor: 1, moe_expert: 16, pipeline: 1, replicas: 1}
          - {tensor: 4, attention_data: 4, moe_tensor: 1, moe_expert: 16, pipeline: 1, replicas: 2}
          - {tensor: 8, attention_data: 2, moe_tensor: 1, moe_expert: 16, pipeline: 1, replicas: 2}
      scheduler: {max_batched_tokens: 8192, max_sequences: 32, decode_reserved_tokens: 512}
      kv_cache:
        block_size: 128
        prefix_caching: false
        capacity: {type: default, memory_fraction: 0.90}
optimization:
  target: throughput_per_gpu
  constraints: {max_candidate_gpus: 64}
optimizer: {algorithm: random, max_trials: 48, parallelism: 4, candidate_timeout_seconds: 120.0, seed: 910}
