traffic:
  source: {type: synthetic, input_tokens: 8192, output_tokens: 1024}
  load:
    type: concurrency
    concurrency: {choices: [1, 4, 8, 16, 32]}
    client_dispatch: {base_ms: 0.23129168159203983, per_input_token_us: 0.11690763496396692}
  stop: {requests_per_load_unit: 2}
engine:
  model: /data_lib/data/models/glm-q
  hardware: ascend910c
  backend: sglang
  backend_version: "0.5.22"
  mode: disaggregated
  context_length: 180000
  nextn: 0
  pd_routing: replica_round_robin
  pd_response: sglang_gateway
  tokenization: {workers: 1, base_ms: 0.8435074705630541, per_input_token_us: 0}
  gemm_quant_mode: w8a8
  moe_quant_mode: w8a8_dynamic
  fmha_quant_mode: bfloat16
  kvcache_quant_mode: bfloat16
  comm_quant_mode: half
  estimation_mode: op_level
  fallback_policy: deny
  estimator_config:
    correction: {enabled: false}
    op_level:
      ascend:
        routing: balanced
        shared_expert_overlap: true
        kv_transfer_page_layout: contiguous
        shape_policy: anchored
        decode_execution_mode: eager
  kv_transfer: {type: measured, timing_mode: full_prompt}
  workers:
    prefill:
      parallelism:
        preset: false
        tensor: 4
        attention_data: 4
        moe_tensor: 1
        moe_expert: 16
        pipeline: 1
        replicas: {choices: [1, 2, 3]}
      scheduler: {max_batched_tokens: 8192, max_sequences: 32, chunked_prefill_size: 16384, max_prefill_tokens: 32768, ignore_eos: true}
      kv_cache:
        block_size: 128
        prefix_caching: false
        capacity: {type: fixed, blocks: 135}
      timing:
        type: default
        estimator_config:
          correction: {enabled: false}
          op_level:
            ascend: {decode_execution_mode: eager, enable_dp_lm_head: true, decode_timing_scope: isolated_kernels, shape_policy: anchored}
    decode:
      parallelism:
        preset: false
        tensor: 4
        attention_data: 4
        moe_tensor: 1
        moe_expert: 16
        pipeline: 1
        replicas: {choices: [1, 2, 3]}
      scheduler: {max_batched_tokens: 8192, max_sequences: 32, decode_reserved_tokens: 512, ignore_eos: true}
      kv_cache:
        block_size: 128
        prefix_caching: false
        capacity: {type: fixed, blocks: 253}
      timing:
        type: default
        estimator_config:
          correction: {enabled: false}
          op_level:
            ascend: {decode_execution_mode: eager, enable_dp_lm_head: false, decode_timing_scope: runtime_layers, shared_expert_overlap: true, shape_policy: anchored}
optimization:
  target: throughput
  constraints: {max_candidate_gpus: 64}
optimizer: {algorithm: random, max_trials: 60, parallelism: 2, candidate_timeout_seconds: 120.0, seed: 910}
